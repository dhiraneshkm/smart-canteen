server.port=${SERVER_PORT:8080}

# Application Identification
spring.application.name=smart-canteen-backend

# Default Database Configuration: H2 with MySQL mode (instant zero-setup dev & test)
# To use MySQL 8, run with: --spring.profiles.active=mysql
spring.datasource.url=${DB_URL:jdbc:h2:mem:smart_canteen;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security & JWT Token Settings
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Queue & Kitchen Configuration
app.kitchen.concurrent-stations=${KITCHEN_CONCURRENT_CAPACITY:2}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
